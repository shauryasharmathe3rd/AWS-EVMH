version: '3.8'

services:
  gateway:
    ports:
      - "${GATEWAY_PORT:-8080}:80"

  frontend:
    build:
      context: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: ["npm", "run", "dev"]

  backend:
    volumes:
      - ./backend:/app
      - ./config.yaml:/app/config.yaml:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  worker:
    volumes:
      - ./worker:/app
      - ./data/raw:/app/data/raw:ro
      - ./config.yaml:/app/config.yaml:ro
    command: ["python", "main.py"]
