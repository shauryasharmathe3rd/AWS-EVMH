events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # Rate limiting zone for public report POSTs
    limit_req_zone $binary_remote_addr zone=reports_limit:10m rate=10r/m;

    upstream backend_service {
        server backend:8000;
    }

    upstream frontend_service {
        server frontend:80;
    }

    server {
        listen 80;
        server_name localhost;

        # Gzip compression
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

        # Reverse proxy /api to backend
        location /api/ {
            proxy_pass http://backend_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Apply rate limiting to report submissions
        location /api/v1/reports {
            limit_req zone=reports_limit burst=5 nodelay;
            proxy_pass http://backend_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Photos from backend
        location /photos/ {
            proxy_pass http://backend_service;
            proxy_set_header Host $host;
        }

        # OpenAPI docs / health
        location /docs {
            proxy_pass http://backend_service;
            proxy_set_header Host $host;
        }
        location /openapi.json {
            proxy_pass http://backend_service;
            proxy_set_header Host $host;
        }
        location /health {
            proxy_pass http://backend_service;
            proxy_set_header Host $host;
        }

        # Frontend static app
        location / {
            proxy_pass http://frontend_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
